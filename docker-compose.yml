services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trials
      POSTGRES_PASSWORD: trials
      POSTGRES_DB: trials
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trials -d trials"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Applies the SQL files in ./migrations. Runs once and exits.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

volumes:
  dbdata:
